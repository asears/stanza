# Enable Dependabot version updates
# This configuration file keeps dependencies up to date automatically
# See: https://docs.github.com/en/code-security/dependabot/

version: 2

updates:
  # Python dependencies via pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    # reviewers:
    #   - "stanfordnlp/stanza-maintainers"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps):"
      prefix-major: "chore(deps)!:"
      include: "scope"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore pre-release versions for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-pre", "version-update:semver-prerelease"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:15"
    open-pull-requests-limit: 5
    # reviewers:
    #   - "stanfordnlp/stanza-maintainers"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions):"
      include: "scope"

