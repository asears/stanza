# Ruff Configuration for Stanza
# Fast Python linter and formatter

# General Configuration
# line-length = 100
line-length = 120
target-version = "py39"
output-format = "concise"

# Toggle for experimental checks, could be matrix in upgrade build
preview = true

[lint]
# Toggle all checks (for testing, not recommended for regular use)
select = ["ALL"]

# # Selected Rule Categories
# select = [
#     "E",      # pycodestyle errors
#     "W",      # pycodestyle warnings
#     "F",      # Pyflakes
#     "I",      # isort
#     "C",      # flake8-comprehensions
#     "B",      # flake8-bugbear
#     "SIM",    # flake8-simplify
# ]

# # Ignored Rules
ignore = [
    "I001",    # isort rules need config or reformat of files
    "D100",    # Missing docstring in public
    "E302",    # 2 blank lines
    "D",       # docstring warnings
    "PLR0402", # use aliases for pytorch?
    "PLR6301", # static method declares
    "PLC",
    "TRY",
    "DOC201",
    "COM812",
    "CPY",
    "D200",
    "D400",
    "D415",
    # "ANN",
    "D203",
    "D212",
    "Q000",    # Single quotes found
    "E501",    #,   # Line too long
    "TD",
    "G",
    "UP",
    "E305",
    "PLR",
    "EM101",
    "E731",
    "FURB",
    "E251",
    "E226",
    "C",
    "EM",
    "ERA",
    "FIX",
    "E261",
    "N806",
    "N",
    "DTZ",
    "FBT",
    "RUF001",
    "T201",
    "BLE",
    "SIM",
    "F405",
    "PERF",
    "DOC",
    "W293",
    "F403",
    "B028",
    #     "E203",   # Whitespace before ':'
    #     # "W503",   # Line break before binary operator
    #     "B008",   # Do not perform function calls in argument defaults
]

# Excluded Paths
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

